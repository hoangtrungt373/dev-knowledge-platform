spring:
  application:
    name: dev-practice-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dev-knowledge-platform}

  liquibase:
    enabled: false
    change-log: classpath:com/ttg/devknowledgeplatform/devpractice/database/sql/dev-practice-service.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: dev_practice

server:
  port: ${SERVER_PORT:8088}

app:
  # Startup data seeding (service.seed.DevPracticeDataSeedingRunner → ProblemSeeder, data/problems/*.md)
  # — off by default; on in the local profile. Idempotent by problem slug.
  seed:
    enabled: ${APP_SEED_ENABLED:false}

  judge0:
    base-url: ${JUDGE0_BASE_URL:https://judge0-ce.p.rapidapi.com}
    rapid-api-key: ${JUDGE0_RAPIDAPI_KEY:}
    rapid-api-host: ${JUDGE0_RAPIDAPI_HOST:judge0-ce.p.rapidapi.com}
    poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:500}
    max-poll-attempts: ${JUDGE0_MAX_POLL_ATTEMPTS:40}
    cpu-time-limit-seconds: ${JUDGE0_CPU_TIME_LIMIT_SECONDS:5}
    connect-timeout: ${JUDGE0_CONNECT_TIMEOUT:5s}
    read-timeout: ${JUDGE0_READ_TIMEOUT:15s}
    retry:
      max-attempts: ${JUDGE0_RETRY_MAX_ATTEMPTS:4}
      initial-interval: ${JUDGE0_RETRY_INITIAL_INTERVAL:1s}
      multiplier: ${JUDGE0_RETRY_MULTIPLIER:2.0}
      max-interval: ${JUDGE0_RETRY_MAX_INTERVAL:10s}
    language-ids:
      java: ${JUDGE0_LANGUAGE_ID_JAVA:62}
      python: ${JUDGE0_LANGUAGE_ID_PYTHON:71}
      javascript: ${JUDGE0_LANGUAGE_ID_JAVASCRIPT:63}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
