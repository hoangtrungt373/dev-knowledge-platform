spring:
  application:
    name: dev-practice-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dev-knowledge-platform}

  liquibase:
    enabled: false
    change-log: classpath:com/ttg/devknowledgeplatform/devpractice/database/sql/dev-practice-service.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: dev_practice

server:
  port: ${SERVER_PORT:8088}

# Judge0 CE — defaults to the hosted RapidAPI instance (JUDGE0_RAPIDAPI_KEY must be set; get one at
# https://rapidapi.com/judge0-official/api/judge0-ce), chosen over this reactor's own self-hosted
# stack (docker-compose.infra.yml's judge0-* services, still there and still an option — repoint
# JUDGE0_BASE_URL at it, e.g. http://localhost:2358, and leave JUDGE0_RAPIDAPI_KEY unset) to avoid
# Judge0's isolate sandbox's known Docker-Desktop-on-Windows/WSL2 friction while this module's
# judging pipeline is still being verified end-to-end — see JudgeClientProperties' own Javadoc and
# this module's CLAUDE.md.
app:
  judge0:
    base-url: ${JUDGE0_BASE_URL:https://judge0-ce.p.rapidapi.com}
    rapid-api-key: ${JUDGE0_RAPIDAPI_KEY:}
    rapid-api-host: ${JUDGE0_RAPIDAPI_HOST:judge0-ce.p.rapidapi.com}
    poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:500}
    max-poll-attempts: ${JUDGE0_MAX_POLL_ATTEMPTS:40}
    cpu-time-limit-seconds: ${JUDGE0_CPU_TIME_LIMIT_SECONDS:5}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
