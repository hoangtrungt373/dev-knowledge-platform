app:
  # MinIO — avatar upload (UserController/UserMapper, via infra's StorageService/StorageConfig).
  # Same MinIO instance/bucket/property keys social-service already uses; this block was missing
  # entirely from this module's own extraction until StorageServiceImpl was actually constructed
  # for the first time (previously masked by the component-scan/@ConfigurationPropertiesScan bugs
  # documented in root CLAUDE.md and docs/CHANGELOG.md — see the `[Unreleased]` entry).
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:user-avatars}
    presigned-url-expiry-minutes: ${MINIO_PRESIGNED_EXPIRY:60}

  # Keycloak Admin REST API — KeycloakAdminService creates user accounts on registration via the
  # identity-service-admin confidential client's service account (manage-users role). See
  # docker/keycloak/realm-export.json for that client's definition.
  keycloak-admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_ADMIN_REALM:dev-knowledge-platform}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:identity-service-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-identity-admin-secret-change-me}

spring:
  application:
    name: identity-service

  # OAuth2/OIDC — Keycloak is the identity provider; this service only ever verifies bearer
  # tokens against Keycloak's JWKS, same realm as gateway/ecommerce-service.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dev-knowledge-platform}

  # Liquibase — disabled by default, same convention as gateway/ecommerce-service: migrations are
  # applied via the consolidated services-liquibase job in docker-compose.apps.yml (no dedicated
  # identity-service-liquibase.yml file exists), not on app boot.
  liquibase:
    enabled: false
    change-log: classpath:com/ttg/devknowledgeplatform/identity/database/sql/identity-service.xml

  # JPA — this module's own schema (`identity`), separate from the monolith's `product` schema.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: identity

# Server — 8082, distinct from gateway's 8080 and ecommerce-service's 8081 (this app runs
# alongside both, not instead of either, until gateway's HTTP proxy to this service is built).
server:
  port: ${SERVER_PORT:8082}

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
