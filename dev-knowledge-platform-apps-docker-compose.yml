# App containers for the seven independently-runnable Spring Boot processes in this repo today
# (gateway, ecommerce-service, identity-service, task-service, social-service, content-service,
# ai-service), plus their one-shot Liquibase migrations. gateway now has zero embedded feature
# modules of its own — it's a bare JWT-verification + Liquibase + UserSeeder shell (see root
# CLAUDE.md's Long-term direction section).
#
# This file MUST be run combined with dev-knowledge-platform-docker-compose.yml in the same
# command — that's what puts every container in one Compose project/network so service-name DNS
# (postgres/redis/minio/keycloak) resolves. Running this file alone will fail.
#
#   docker compose -f dev-knowledge-platform-docker-compose.yml \
#                   -f dev-knowledge-platform-apps-docker-compose.yml \
#                   up -d --build
#
# Required env vars on the host (no in-file defaults, since these are secrets/environment-specific):
#   OPENAI_API_KEY, FRONTEND_URL (optional, defaults to http://localhost:3000)
#   INTERNAL_API_KEY (optional — defaults to the same dev-only placeholder both ai-service and
#   content-service fall back to; override in production)

services:

  # One-shot migration runners — same image/changelog paths as the standalone
  # dev-knowledge-platform-liquibase.yml / ecommerce-service-liquibase.yml files, but targeting
  # `postgres` by service name instead of host.docker.internal, since this file always runs
  # joined to the infra compose project.
  dkp-liquibase:
    image: liquibase/liquibase:4.29
    entrypoint: ["liquibase"]
    command:
      - --search-path=/changelog
      - --changelog-file=dev-knowledge-platform.xml
      - --url=jdbc:postgresql://postgres:5432/dev-premier
      - --username=postgres
      - --password=password
      - --driver=org.postgresql.Driver
      - update
    volumes:
      - ./gateway/src/main/java/com/ttg/devknowledgeplatform/database/sql:/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  ecommerce-liquibase:
    image: liquibase/liquibase:4.29
    entrypoint: ["liquibase"]
    command:
      - --search-path=/changelog
      - --changelog-file=ecommerce-service.xml
      - --url=jdbc:postgresql://postgres:5432/dev-premier
      - --username=postgres
      - --password=password
      - --driver=org.postgresql.Driver
      - update
    volumes:
      - ./ecommerce-service/src/main/java/com/ttg/devknowledgeplatform/ecommerce/database/sql:/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  identity-liquibase:
    image: liquibase/liquibase:4.29
    entrypoint: ["liquibase"]
    command:
      - --search-path=/changelog
      - --changelog-file=identity-service.xml
      - --url=jdbc:postgresql://postgres:5432/dev-premier
      - --username=postgres
      - --password=password
      - --driver=org.postgresql.Driver
      - update
    volumes:
      - ./identity-service/src/main/java/com/ttg/devknowledgeplatform/identity/database/sql:/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  task-liquibase:
    image: liquibase/liquibase:4.29
    entrypoint: ["liquibase"]
    command:
      - --search-path=/changelog
      - --changelog-file=task-service.xml
      - --url=jdbc:postgresql://postgres:5432/dev-premier
      - --username=postgres
      - --password=password
      - --driver=org.postgresql.Driver
      - update
    volumes:
      - ./task-service/src/main/java/com/ttg/devknowledgeplatform/task/database/sql:/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  social-liquibase:
    image: liquibase/liquibase:4.29
    entrypoint: ["liquibase"]
    command:
      - --search-path=/changelog
      - --changelog-file=social-service.xml
      - --url=jdbc:postgresql://postgres:5432/dev-premier
      - --username=postgres
      - --password=password
      - --driver=org.postgresql.Driver
      - update
    volumes:
      - ./social-service/src/main/java/com/ttg/devknowledgeplatform/social/database/sql:/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  content-liquibase:
    image: liquibase/liquibase:4.29
    entrypoint: ["liquibase"]
    command:
      - --search-path=/changelog
      - --changelog-file=content-service.xml
      - --url=jdbc:postgresql://postgres:5432/dev-premier
      - --username=postgres
      - --password=password
      - --driver=org.postgresql.Driver
      - update
    volumes:
      - ./content-service/src/main/java/com/ttg/devknowledgeplatform/content/database/sql:/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  ai-liquibase:
    image: liquibase/liquibase:4.29
    entrypoint: ["liquibase"]
    command:
      - --search-path=/changelog
      - --changelog-file=ai-service.xml
      - --url=jdbc:postgresql://postgres:5432/dev-premier
      - --username=postgres
      - --password=password
      - --driver=org.postgresql.Driver
      - update
    volumes:
      - ./ai-service/src/main/java/com/ttg/devknowledgeplatform/ai/database/sql:/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: dev-premier-gateway
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dev-knowledge-platform
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      dkp-liquibase:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  ecommerce-service:
    build:
      context: .
      dockerfile: ecommerce-service/Dockerfile
    container_name: dev-premier-ecommerce-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev-premier
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dev-knowledge-platform
    ports:
      - "8081:8081"
    depends_on:
      ecommerce-liquibase:
        condition: service_completed_successfully

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: dev-premier-identity-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev-premier
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dev-knowledge-platform
    ports:
      - "8082:8082"
    depends_on:
      identity-liquibase:
        condition: service_completed_successfully

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: dev-premier-task-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev-premier
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dev-knowledge-platform
    ports:
      - "8083:8083"
    depends_on:
      task-liquibase:
        condition: service_completed_successfully

  social-service:
    build:
      context: .
      dockerfile: social-service/Dockerfile
    container_name: dev-premier-social-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev-premier
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dev-knowledge-platform
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MINIO_ENDPOINT: http://minio:9000
      APP_SEED_ENABLED: "true"
    ports:
      - "8084:8084"
    depends_on:
      social-liquibase:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: dev-premier-content-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev-premier
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dev-knowledge-platform
      # Must match ai-service's own INTERNAL_API_KEY below — both read the same host env var so
      # the shared secret stays in sync without duplicating it in two places.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me}
      APP_SEED_ENABLED: "true"
    ports:
      - "8085:8085"
    depends_on:
      content-liquibase:
        condition: service_completed_successfully

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: dev-premier-ai-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev-premier
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/dev-knowledge-platform
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set on the host}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # This module's own ContentServiceClient reaches content-service by its Compose service
      # name now that both are separate containers — see content-service/CLAUDE.md.
      CONTENT_SERVICE_BASE_URL: http://content-service:8085
      # Must match content-service's own INTERNAL_API_KEY above — both read the same host env var
      # so the shared secret stays in sync without duplicating it in two places.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me}
    ports:
      - "8086:8086"
    depends_on:
      ai-liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      content-service:
        condition: service_started
