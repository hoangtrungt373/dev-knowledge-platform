spring:
  # Real datasource/redis/minio/keycloak coordinates are injected per-test-run by
  # AbstractStompIntegrationTest's @DynamicPropertySource (Testcontainers-assigned ports) —
  # including spring.security.oauth2.resourceserver.jwt.issuer-uri, since the Keycloak
  # Testcontainer's URL isn't known until it starts.
  liquibase:
    enabled: true

  jpa:
    show-sql: false

# CSV/sample-data seeding is irrelevant to the DM STOMP flow and would only slow context startup.
app:
  seed:
    enabled: false

logging:
  level:
    com.ttg.devknowledgeplatform: INFO
    org.springframework.security: WARN
