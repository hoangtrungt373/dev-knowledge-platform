spring:
  # OAuth2/OIDC — Keycloak is the identity provider now; see jwt issuer-uri below.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:dev-premier}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # Liquibase — enabled in Docker
  liquibase:
    enabled: true

  # Redis — service name and password differ from base defaults
  data:
    redis:
      host: ${REDIS_HOST:redis}
      password: ${REDIS_PASSWORD:password}

# Application
app:
  frontend:
    url: ${FRONTEND_URL}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  ai:
    embedding-model:
      api-key: ${OPENAI_API_KEY}
  seed:
    enabled: true

# Logging
logging:
  level:
    com.ttg.devknowledgeplatform: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
