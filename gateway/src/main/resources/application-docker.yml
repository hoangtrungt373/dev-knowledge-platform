spring:
  # OAuth2/OIDC — Keycloak is the identity provider now; see jwt issuer-uri below.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:dev-premier}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

# Application
app:
  frontend:
    url: ${FRONTEND_URL}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}

  # Compose service DNS names, not localhost — see application.yml's own comment.
  services:
    ecommerce-service-base-url: http://ecommerce-service:8081
    identity-service-base-url: http://identity-service:8082
    task-service-base-url: http://task-service:8083
    social-service-base-url: http://social-service:8084
    content-service-base-url: http://content-service:8085
    ai-service-base-url: http://ai-service:8086

# Logging
logging:
  level:
    com.ttg.devknowledgeplatform: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
