spring:
  application:
    name: dev-knowledge-platform

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # OAuth2/OIDC — Keycloak is the identity provider now (hosted login page, Google/Facebook
  # brokered inside Keycloak itself, not configured here). This app only ever verifies bearer
  # tokens against Keycloak's JWKS — see oauth2.resourceserver below.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dev-knowledge-platform}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: product

# Server
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      # Worker threads that process HTTP requests (Tomcat default: 200). This app has no SSE
      # endpoints of its own anymore (moved to ai-service along with sseStreamExecutor), so this
      # default is no longer tied to that pool's sizing the way ai-service's own copy of this
      # comment is.
      max: ${TOMCAT_THREADS_MAX:200}
      # Threads kept alive when idle — prevents cold-start latency on traffic spikes.
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    # Queue depth for incoming connections when all worker threads are busy.
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    mbeanregistry:
      # Must be true for TomcatMetricsBinder to register tomcat.threads.* metrics at /actuator/metrics.
      enabled: true

# Application
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:user-avatars}
    presigned-url-expiry-minutes: ${MINIO_PRESIGNED_EXPIRY:60}

  # Base URLs of the six standalone services routing/GatewayRoutesConfig proxies to — defaults to
  # each service running directly on the host machine (e.g. `mvn spring-boot:run` per module);
  # overridden in application-docker.yml to each one's Compose DNS name.
  services:
    ecommerce-service-base-url: ${ECOMMERCE_SERVICE_BASE_URL:http://localhost:8081}
    identity-service-base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8082}
    task-service-base-url: ${TASK_SERVICE_BASE_URL:http://localhost:8083}
    social-service-base-url: ${SOCIAL_SERVICE_BASE_URL:http://localhost:8084}
    content-service-base-url: ${CONTENT_SERVICE_BASE_URL:http://localhost:8085}
    ai-service-base-url: ${AI_SERVICE_BASE_URL:http://localhost:8086}

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
