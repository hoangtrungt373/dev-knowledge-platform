spring:
  application:
    name: ecommerce-service

  # Liquibase — disabled by default, same convention as gateway: migrations are applied via the
  # standalone ecommerce-service-liquibase.yml docker-compose file, not on app boot.
  liquibase:
    enabled: false
    change-log: classpath:com/ttg/devknowledgeplatform/ecommerce/database/sql/ecommerce-service.xml

  # JPA — this module's own database (the `ecommerce` schema), separate from the monolith's
  # `product` schema. Entities already specify schema="ecommerce" per @Table, but
  # default_schema is set too for consistency with gateway's convention.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ecommerce

# Server — 8081, not gateway's 8080 (this app runs alongside it, not instead of it, until
# gateway's HTTP proxy to this service is built).
server:
  port: ${SERVER_PORT:8081}

# JWT — verification only (see security/JwtVerifier). This service never holds identity-service's
# private key, only the public half — jwt.public-key-location must point at the matching public
# key for whatever private key identity-service/gateway signs with.
jwt:
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:jwt/dev-jwt-public.pem}

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
