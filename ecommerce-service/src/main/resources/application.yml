spring:
  application:
    name: ecommerce-service

  # OAuth2/OIDC — Keycloak is the identity provider; this service only ever verifies bearer
  # tokens against Keycloak's JWKS, same realm as gateway.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dev-knowledge-platform}

  # Liquibase — disabled by default, same convention as gateway: migrations are applied via the
  # consolidated services-liquibase job in docker-compose.apps.yml (no dedicated
  # ecommerce-service-liquibase.yml file exists), not on app boot.
  liquibase:
    enabled: false
    change-log: classpath:com/ttg/devknowledgeplatform/ecommerce/database/sql/ecommerce-service.xml

  # JPA — this module's own database (the `ecommerce` schema), separate from the monolith's
  # `product` schema. Entities already specify schema="ecommerce" per @Table, but
  # default_schema is set too for consistency with gateway's convention.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ecommerce

# Server — 8081, not gateway's 8080 (this app runs alongside it, not instead of it, until
# gateway's HTTP proxy to this service is built).
server:
  port: ${SERVER_PORT:8081}

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
