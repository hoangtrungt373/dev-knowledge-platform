app:
  # MinIO — product image gallery uploads (ProductServiceImpl.uploadImage/ProductMapper's
  # presigned-URL resolution, via infra's StorageService/StorageConfig). Same MinIO
  # instance/endpoint/credentials identity-service's own avatar upload already uses; only the
  # bucket differs (own bucket per upload use case, not shared).
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:product-images}
    presigned-url-expiry-minutes: ${MINIO_PRESIGNED_EXPIRY:60}

  # CSV-based sample catalog seeding (EcommerceDataSeedingRunner) — off by default, enabled per
  # profile, same property name/shape as content-service's/social-service's own seeders.
  seed:
    enabled: ${APP_SEED_ENABLED:false}

  ecommerce:
    cart:
      # Sliding TTL (US-2.4) — refreshed on every cart mutation, never on a plain read. ISO-8601
      # duration format, same style as OutboxRelay's own app.ecommerce.outbox.relay.poll-interval.
      ttl: ${CART_TTL:P30D}

    checkout:
      # FreeOverThresholdShippingFeeCalculator (the active shipping.ShippingFeeCalculator bean):
      # free shipping once the subtotal reaches free-shipping-threshold, else this flat fee —
      # both externalized rather than hardcoded, same convention as app.ecommerce.cart.ttl above.
      flat-shipping-fee: ${CHECKOUT_FLAT_SHIPPING_FEE:5.00}
      free-shipping-threshold: ${CHECKOUT_FREE_SHIPPING_THRESHOLD:50.00}

    order:
      # US-3.2: how long a PENDING order's stock reservation survives with no payment attempted
      # before OrderReservationExpiryJob releases it — same ISO-8601 duration convention as
      # app.ecommerce.cart.ttl above.
      reservation-timeout: ${ORDER_RESERVATION_TIMEOUT:PT15M}
      expiry-check:
        # How often OrderReservationExpiryJob polls for abandoned reservations — same
        # fixedDelayString convention as outbox.OutboxRelay's own poll-interval.
        poll-interval: ${ORDER_EXPIRY_CHECK_POLL_INTERVAL:PT1M}

      reconciliation:
        # US-3.4: how long an order may sit PAYMENT_PROCESSING before OrderReconciliationJob
        # re-queries the gateway for it, and how often that job polls.
        grace-period: ${ORDER_RECONCILIATION_GRACE_PERIOD:PT2M}
        poll-interval: ${ORDER_RECONCILIATION_POLL_INTERVAL:PT1M}

spring:
  application:
    name: ecommerce-service

  # OAuth2/OIDC — Keycloak is the identity provider; this service only ever verifies bearer
  # tokens against Keycloak's JWKS, same realm as gateway.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dev-knowledge-platform}

  # Redis — Epic 2's cart storage (primary store, not a cache; see
  # docs/user-stories/02-cart-checkout.md). Same property names/env vars as ai-service's own
  # Redis connection (its Bucket4j rate limiter) — this module connects to the identical shared
  # instance, just under its own "cart:" key prefix so the two services' keys never collide.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Matches docker-compose.infra.yml's redis service (`--requirepass password`) and
      # docker-compose.apps.yml's own ${REDIS_PASSWORD:-password} default for the containerized
      # run — without this default, a local (non-container) run against that same Redis instance
      # gets a NOAUTH error, since Spring Data Redis's own default is no password at all.
      password: ${REDIS_PASSWORD:password}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2000ms}

  # Liquibase — disabled by default, same convention as gateway: migrations are applied via the
  # consolidated services-liquibase job in docker-compose.apps.yml (no dedicated
  # ecommerce-service-liquibase.yml file exists), not on app boot.
  liquibase:
    enabled: false
    change-log: classpath:com/ttg/devknowledgeplatform/ecommerce/database/sql/ecommerce-service.xml

  # JPA — this module's own database (the `ecommerce` schema), separate from the monolith's
  # `product` schema. Entities already specify schema="ecommerce" per @Table, but
  # default_schema is set too for consistency with gateway's convention.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ecommerce

# Server — 8081, not gateway's 8080 (this app runs alongside it, not instead of it, until
# gateway's HTTP proxy to this service is built).
server:
  port: ${SERVER_PORT:8081}

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
